<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Squircle for professional look -->
    <rect x="0" y="0" width="1024" height="1024" rx="220" fill="#000000"/>

    <!-- Outer Record (Vinyl) -->
    <circle cx="512" cy="512" r="420" fill="#111111"/>

    <!-- Grooves (Concentric circles for texture) -->
    <circle cx="512" cy="512" r="380" fill="none" stroke="#1A1A1A" stroke-width="4"/>
    <circle cx="512" cy="512" r="340" fill="none" stroke="#1A1A1A" stroke-width="4"/>
    <circle cx="512" cy="512" r="300" fill="none" stroke="#1A1A1A" stroke-width="4"/>
    <circle cx="512" cy="512" r="260" fill="none" stroke="#1A1A1A" stroke-width="4"/>

    <!-- The Record Label (Center) -->
    <circle cx="512" cy="512" r="160" fill="#ef4444"/>

    <!-- Center Hole -->
    <circle cx="512" cy="512" r="35" fill="#000000"/>

    <!-- Professional Shine/Reflection -->
    <path d="M 512 92 A 420 420 0 0 1 932 512 L 732 512 A 220 220 0 0 0 512 292 Z" fill="white" fill-opacity="0.07"/>
    <path d="M 512 932 A 420 420 0 0 1 92 512 L 292 512 A 220 220 0 0 0 512 732 Z" fill="white" fill-opacity="0.03"/>

    <!-- Minimalist Music Representation: A small note inside the label -->
    <path d="M 525 460 L 525 540 A 15 15 0 1 1 505 555 L 505 480 L 550 470 L 550 500" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>