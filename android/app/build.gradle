apply plugin: 'com.android.application'

def signingPropertiesFile = rootProject.file('signing.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}

android {
    namespace = "com.wenodh.vibeon"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.wenodh.vibeon"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.0.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    def hasSigningProps = signingPropertiesFile.exists()
    def storeFilePath = hasSigningProps ? signingProperties['RELEASE_STORE_FILE'] : (System.getenv("RELEASE_STORE_FILE") ?: 'release-key.keystore')
    def storePasswordVal = hasSigningProps ? signingProperties['RELEASE_STORE_PASSWORD'] : System.getenv("RELEASE_STORE_PASSWORD")
    def keyAliasVal = hasSigningProps ? signingProperties['RELEASE_KEY_ALIAS'] : System.getenv("RELEASE_KEY_ALIAS")
    def keyPasswordVal = hasSigningProps ? signingProperties['RELEASE_KEY_PASSWORD'] : System.getenv("RELEASE_KEY_PASSWORD")

    def resolvedKeystoreFile = storeFilePath ? file(storeFilePath) : null
    if (resolvedKeystoreFile != null && !resolvedKeystoreFile.exists()) {
        resolvedKeystoreFile = rootProject.file(storeFilePath)
    }
    def keystoreFile = resolvedKeystoreFile
    def isSigningConfigured = (keystoreFile != null && keystoreFile.exists() && storePasswordVal && keyAliasVal && keyPasswordVal)

    signingConfigs {
        release {
            if (isSigningConfigured) {
                storeFile keystoreFile
                storePassword storePasswordVal
                keyAlias keyAliasVal
                keyPassword keyPasswordVal
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (isSigningConfigured) signingConfig signingConfigs.release
        }
    }

    gradle.taskGraph.whenReady { taskGraph ->
        def releaseRequested = taskGraph.allTasks.any { task ->
            task.name.contains("Release") || task.name.contains("release")
        }
        if (releaseRequested && !isSigningConfigured) {
            throw new GradleException("\nRELEASE BUILD FAILED: Missing Production Signing Configuration!\nSet android/signing.properties or RELEASE_* environment variables.")
        }
    }

    configurations {
        all {
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        }
    }
}

repositories {
    flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.8.0"
    implementation "androidx.media3:media3-session:1.8.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
