<!doctype html>
<html lang="en">

<head>
  <script>
    const isDarkMode = localStorage.getItem('theme') === 'dark' ||
      (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (isDarkMode) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#1f2937" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="description" content="Vibe On is a modern, responsive music app built with React, TypeScript, and Tailwind CSS, offering seamless music streaming with a stunning Glassmorphism UI." />
  <link rel="icon" type="image/png" href="/ios/40.png" />
  <link rel="apple-touch-icon" href="/ios/180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single&family=Black+Ops+One&family=Bitcount+Grid+Double&family=Croissant+One&display=swap" rel="stylesheet">
  <title>Vibe On</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
