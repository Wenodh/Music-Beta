name: Calling Reliability E2E

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  browser-calling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
