name: Build Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Initialize Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sync with Capacitor
        run: npx cap sync android

      - name: Decode Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEY_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEY_BASE64 }}" | base64 --decode > android/app/release-key.keystore
          elif [ -n "${{ vars.RELEASE_KEY_BASE64 }}" ]; then
            echo "${{ vars.RELEASE_KEY_BASE64 }}" | base64 --decode > android/app/release-key.keystore
          else
            echo "Warning: RELEASE_KEY_BASE64 not found. Build will be unsigned. This is fine for testing, but Google Play requires signing for production."
          fi

      - name: Build Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_FILE: release-key.keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vibeon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vibeon-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
