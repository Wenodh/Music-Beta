name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Password for the keystore'
        required: true
        default: 'vibeon123'
      key_alias:
        description: 'Alias for the key'
        required: true
        default: 'vibeon'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release-key.keystore \
            -alias ${{ github.event.inputs.key_alias }} \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ${{ github.event.inputs.keystore_password }} \
            -keypass ${{ github.event.inputs.keystore_password }} \
            -dname "CN=VibeOn, OU=Dev, O=VibeOn, L=World, S=World, C=US"

      - name: Export PEM Certificate
        run: |
          keytool -export -rfc \
            -alias ${{ github.event.inputs.key_alias }} \
            -file upload_certificate.pem \
            -keystore release-key.keystore \
            -storepass ${{ github.event.inputs.keystore_password }}

      - name: Convert to Base64
        run: |
          base64 release-key.keystore > keystore_base64.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-package
          path: |
            release-key.keystore
            upload_certificate.pem
            keystore_base64.txt
          retention-days: 1
